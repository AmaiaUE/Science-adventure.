<!doctype html><html lang="eu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARING · Science Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f5fa;color:#1a3049;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}.wrap{max-width:850px;margin:auto;padding:20px}header{text-align:center;padding:12px 0 18px}h1{margin:0;font-size:clamp(25px,5vw,38px)}h2{margin:8px 0 16px;font-size:23px}.sub{color:#61758a}.panel{background:white;border:1px solid #dce6ee;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 12px #19334d08}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav button{min-height:66px}.btn,button{font:inherit;cursor:pointer;border:1px solid #c7d8e7;border-radius:11px;background:white;color:#234563;padding:10px 14px}button:hover{background:#edf6ff}button.active,.primary{background:#1665a8;color:white;border-color:#1665a8}.primary:hover{background:#11548e}.btn:disabled{opacity:.45;cursor:not-allowed}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:13px}.correct{border-color:#21966a!important;background:#e8f8ef!important;color:#166744!important}.wrong{border-color:#c94747!important;background:#fff0f0!important;color:#a63232!important}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.vocab{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e8edf2;padding:12px 0}.vocab .word{flex:1}.vocab strong{display:block;font-size:18px}.hint{color:#64778a}.tag{display:inline-block;background:#e8f3fc;padding:6px 12px;border-radius:100px;font-weight:700;font-size:13px}.bar{height:9px;background:#e7edf2;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#218d6e}.steps{display:flex;gap:8px;justify-content:center}.steps button{border-radius:100px;width:43px;height:43px;padding:0}.field{width:100%;padding:12px;border:1px solid #bacbda;border-radius:9px;font:inherit;font-size:17px;margin-top:7px}.examitem label{display:block;margin:7px 0;cursor:pointer}.examitem input{margin-right:9px}.result{text-align:center;background:#e8f8ef;padding:22px;border-radius:16px}.result b{font-size:38px;color:#167c5c}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}.small{font-size:13px}.speech{font-size:20px}.hide{display:none}footer{text-align:center;padding:18px;color:#687b8f;font-size:12px}@media(max-width:480px){.wrap{padding:10px}.panel{padding:14px}.nav button{font-size:12px;padding:8px 3px}}</style></head><body><main class="wrap"><header><h1 id="title"></h1><div class="sub">Science ikasi, pausoz pauso · Ikasi jolastuz! · LH3</div></header><nav class="nav panel" aria-label="Game sections"><button data-tab="learn">📚 Learn<br><small>Ikasi</small></button><button data-tab="vocab">🔤 Vocabulary<br><small>Hiztegia</small></button><button data-tab="how">💡 How it works<br><small>Nola?</small></button><button data-tab="quiz">🎯 Quiz<br><small>Galderak</small></button><button data-tab="gaps">✏️ Fill gaps<br><small>Hutsuneak</small></button><button data-tab="exam">🏆 Exam<br><small>Azterketa</small></button></nav><div class="row panel"><span>🇬🇧 English + 🇪🇺 Euskara</span><label><input type="checkbox" id="toggle" checked> Show Basque / Euskaraz</label></div><section id="content" class="panel" aria-live="polite"></section><footer><div id="audio-status" role="status" aria-live="polite" hidden style="background:#fff3d9;color:#59420a;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px"></div>🔊 English pronunciation uses your browser's speech system. / Ahoskera nabigatzailearen ahots-sistemaren araberakoa da.<br>Works offline · Internetik gabe erabil daiteke.</footer></main><script>const DATA={"icon": "👂", "name": "HEARING", "eu": "ENTZUMENA", "intro": "Hearing lets us hear sounds. The ears are the organs of hearing. The ear has an outer, middle and inner part. Sound waves make the eardrum vibrate. The brain interprets sound. Earwax helps protect the ear canal.", "introeu": "Entzumenak soinuak entzuteko balio du. Belarriak entzumenaren organoak dira. Kanpoko, erdiko eta barneko belarria bereizten dira. Soinu-uhinek belarri-mintza bibrarazten dute. Garunak soinua interpretatzen du. Belarri-zizariak kanala babesten laguntzen du.", "vocab": [["Ears", "Belarriak"], ["Hearing", "Entzumena"], ["Sound", "Soinua"], ["Sound waves", "Soinu-uhinak"], ["Outer ear", "Kanpoko belarria"], ["Middle ear", "Erdiko belarria"], ["Inner ear", "Barneko belarria"], ["Eardrum", "Belarri-mintza"], ["Ear canal", "Belarri-kanala"], ["Earwax", "Belarri-zizaria"], ["Brain", "Garuna"]], "steps": [["Sound waves enter the outer ear.", "Soinu-uhinak kanpoko belarritik sartzen dira.", "SOUND → OUTER EAR"], ["Sound waves travel through the ear canal.", "Soinu-uhinek belarri-kanala zeharkatzen dute.", "EAR CANAL"], ["The eardrum vibrates.", "Belarri-mintzak bibratzen du.", "EARDRUM → VIBRATION"], ["Signals reach the brain, which interprets sounds.", "Seinaleak garunera iristen dira, eta garunak soinuak interpretatzen ditu.", "BRAIN → SOUND"]], "facts": [["The organs of hearing are the…", ["eyes", "ears", "nose"], 1], ["What travels into the ear?", ["light", "sound waves", "flavours"], 1], ["The ear has how many main parts?", ["two", "three", "five"], 1], ["What vibrates when sound arrives?", ["eardrum", "tongue", "retina"], 0], ["Which part is on the outside?", ["inner ear", "outer ear", "middle ear"], 1], ["Ear canal means…", ["belarri-kanala", "betazala", "sudur-zuloa"], 0], ["Earwax helps…", ["see colours", "protect the ear canal", "taste food"], 1], ["The brain interprets…", ["sounds", "light only", "sweetness only"], 0], ["The eardrum is in the…", ["eye", "ear", "nose"], 1], ["The inner ear is…", ["inside the ear", "outside the head", "on the tongue"], 0], ["Sound waves can make the eardrum…", ["change colour", "vibrate", "see"], 1], ["Hearing means…", ["ikusmena", "dastamena", "entzumena"], 2]], "gaps": [["The ", "ears", "Belarriak"], ["We hear ", "sounds", "Soinuak"], ["Sound travels in ", "waves", "Uhinak"], ["The ", "eardrum", "Belarri-mintza"], ["The ear has ", "three", "Hiru"], ["The ", "brain", "Garuna"], ["The ", "outer", "Kanpokoa"], ["The ", "earwax", "Belarri-zizaria"]], "gapends": [" are the organs of hearing.", ".", ".", " vibrates.", " main parts.", " interprets sounds.", " ear is on the outside.", " helps protect the ear canal."]};const d=DATA;let tab='learn',qi=0,step=0,quiz={},gaps={},exam={},gchecked=false,echecked=false,showEu=true;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let activeSpeech=null, speechWatch=null;
function audioMessage(msg){let el=document.getElementById('audio-status');if(el){el.textContent=msg;el.hidden=false}}
function say(s){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
    audioMessage('⚠️ Ahotsa ez dago erabilgarri hemen. Saiatu Safari-n irekitzen.');return;
  }
  const synth=window.speechSynthesis;
  clearTimeout(speechWatch);
  try{
    if(synth.paused)synth.resume();
    if(synth.speaking||synth.pending)synth.cancel();
    const u=new SpeechSynthesisUtterance(s);
    activeSpeech=u;u.lang='en-GB';u.rate=0.88;u.pitch=1;u.volume=1;
    const voices=synth.getVoices();
    const voice=voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.toLowerCase().startsWith('en-'));
    if(voice)u.voice=voice;
    let started=false;
    u.onstart=()=>{started=true;clearTimeout(speechWatch);audioMessage('🔊 Entzuten… / Speaking…')};
    u.onend=()=>{clearTimeout(speechWatch);audioMessage('✓ Audioa amaitu da / Finished')};
    u.onerror=e=>{clearTimeout(speechWatch);audioMessage('⚠️ Ezin izan da ahotsa entzun ('+(e.error||'audio')+'). Saiatu Safari-n.')};
    audioMessage('🔊 Audioa abiarazten…');
    synth.speak(u);
    if(synth.paused)synth.resume();
    speechWatch=setTimeout(()=>{
      if(!started){audioMessage('⚠️ iPhoneak ez du audioa abiarazi. WhatsAppen aurrebistak ahotsa blokea dezake; ireki Safari-n.');}
    },3500);
  }catch(e){audioMessage('⚠️ Audio-errorea: '+e.message)}
}
function speakbtn(s){return `<button class="speech" title="Listen / Entzun" onclick='say(${JSON.stringify(s).replace(/'/g,'&#39;')})'>🔊</button>`}function render(){document.title=d.name+' · Science Adventure';$('#title').textContent=d.icon+' '+d.name+' · '+d.eu;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#toggle').checked=showEu;let x='';if(tab==='learn'){x=`<span class="tag">1 · UNDERSTAND / ULERTU</span><h2>📚 What is ${d.name.toLowerCase()}?</h2><p>${esc(d.intro)} ${speakbtn(d.intro)}</p>${showEu?`<p class="hint">${esc(d.introeu)}</p>`:''}<hr><span class="tag">2 · LEARN IN ENGLISH</span><h2>Important sentences</h2>${d.steps.slice(0,3).map((s,i)=>`<div class="panel"><b>${i+1}. ${esc(s[0])}</b> ${speakbtn(s[0])}${showEu?`<p class="hint">${esc(s[1])}</p>`:''}</div>`).join('')}<p class="hint">🎓 Read, listen, repeat and practise. / Irakurri, entzun, errepikatu eta praktikatu.</p><button class="primary" onclick="go('vocab')">Next: Vocabulary →</button>`}if(tab==='vocab'){x=`<h2>🔤 Vocabulary · Hiztegia</h2><p class="hint">Listen and repeat. / Entzun eta errepikatu.</p>${d.vocab.map((v,i)=>`<div class="vocab"><span class="tag">${i+1}</span><div class="word"><strong>${esc(v[0])}</strong>${showEu?`<span class="hint">${esc(v[1])}</span>`:''}</div>${speakbtn(v[0])}</div>`).join('')}<div class="actions"><button class="primary" onclick="go('how')">Next: How it works →</button></div>`}if(tab==='how'){let s=d.steps[step];x=`<h2>💡 How does ${d.name.toLowerCase()} work?</h2><p class="hint">Learn the four steps! / Ikasi lau urratsak!</p><div class="steps">${d.steps.map((_,i)=>`<button class="${i===step?'active':''}" onclick="step=${i};render()">${i+1}</button>`).join('')}</div><div class="panel"><span class="tag">STEP ${step+1} / 4</span><h2>${esc(s[0])}</h2>${speakbtn(s[0])}${showEu?`<p class="hint">${esc(s[1])}</p>`:''}<p class="tag">${esc(s[2])}</p></div><div class="actions"><button ${step===0?'disabled':''} onclick="step--;render()">← Previous</button><button class="primary" onclick="${step===3?"go('quiz')":"step++;render()"}">${step===3?'Play quiz!':'Next step →'}</button></div><p class="hint">🧠 ${esc(d.steps.map(s=>s[2]).join(' · '))}</p>`}if(tab==='quiz'){let q=d.facts[qi],a=quiz[qi],score=d.facts.filter((v,i)=>quiz[i]===v[2]).length;x=`<span class="tag">MULTIPLE CHOICE</span><h2>🎯 Choose the correct answer</h2><div class="row"><b>${qi+1}. galdera / ${d.facts.length}</b><span>⭐ ${score} points</span></div><div class="bar"><div style="width:${(qi+1)/d.facts.length*100}%"></div></div><div class="panel"><h2>${esc(q[0])}</h2></div>${q[1].map((o,i)=>`<button class="choice ${a===undefined?'':i===q[2]?'correct':a===i?'wrong':''}" onclick="chooseQuiz(${i})">${'ABC'[i]}. ${esc(o)} ${a!==undefined&&i===q[2]?'✓':''}</button>`).join('')}${a!==undefined?`<p><b>${a===q[2]?'⭐ Excellent! / Bikain!':'💡 Good try! / Saiakera ona!'}</b></p>`:''}<div class="actions"><button onclick="quiz={};qi=0;render()">↻ Berriro hasi</button><button class="primary" ${a===undefined?'disabled':''} onclick="${qi===d.facts.length-1?"go('gaps')":"qi++;render()"}">${qi===d.facts.length-1?'Fill the gaps →':'Hurrengoa →'}</button></div>`}if(tab==='gaps'){let score=d.gaps.filter((g,i)=>norm(gaps[i])===g[1]).length;x=`<span class="tag">FILL IN THE GAPS</span><h2>✏️ Complete the English sentences</h2><p class="hint">Idatzi falta den hitza ingelesez. Euskarazko pistak lagunduko dizu.</p>${d.gaps.map((g,i)=>`<div class="panel"><b>${i+1}. ${esc(g[0])} ______ ${esc(d.gapends[i])}</b>${showEu?`<p class="hint">💡 ${esc(g[2])}</p>`:''}<input class="field" aria-label="Answer ${i+1}" autocomplete="off" placeholder="Write in English..." value="${esc(gaps[i]||'')}" oninput="gaps[${i}]=this.value;gchecked=false" />${gchecked?`<p class="${norm(gaps[i])===g[1]?'correct':'wrong'}">${norm(gaps[i])===g[1]?'✓ Correct!':'✗ Correct answer: '+esc(g[1])}</p>`:''}</div>`).join('')}${gchecked?`<div class="result"><b>${score} / 8</b><p>${score===8?'Excellent! / Bikain!':'Keep practising! / Jarraitu praktikatzen!'}</p></div>`:''}<div class="actions"><button onclick="gaps={};gchecked=false;render()">↻ Berriro hasi</button><button class="primary" onclick="saveGaps();gchecked=true;render()">Erantzunak zuzendu</button></div><div class="actions"><button onclick="go('exam')">🏆 Final exam →</button></div>`}if(tab==='exam'){let score=d.facts.slice(0,10).filter((q,i)=>exam[i]===q[2]).length;x=`<span class="tag">FINAL TEST · AZKEN PROBA</span><h2>🏆 ${d.name} Exam</h2><p class="hint">10 galdera. Saiatu apunterik begiratu gabe erantzuten!</p>${d.facts.slice(0,10).map((q,i)=>`<div class="panel examitem"><b>${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${exam[i]===j?'checked':''} ${echecked?'disabled':''} onchange="exam[${i}]=${j};updateExamProgress()">${esc(o)}</label>`).join('')}${echecked?`<p class="${exam[i]===q[2]?'correct':'wrong'}">${exam[i]===q[2]?'✓ Correct!':'✗ Correct: '+esc(q[1][q[2]])}</p>`:''}</div>`).join('')}${echecked?`<div class="result"><h2>🏆 ${score===10?'PERFECT!':score>=8?'EXCELLENT!':score>=5?'GOOD JOB!':'KEEP PRACTISING!'}</h2><b>${score} / 10</b><p>${score*10}%</p></div>`:''}<div class="actions"><button onclick="exam={};echecked=false;render()">↻ Berriro hasi</button><button id="submitExam" class="primary" ${echecked||Object.keys(exam).length<10?'disabled':''} onclick="echecked=true;render()">Azterketa zuzendu</button></div><p class="hint small" id="examprogress">${Object.keys(exam).length} / 10 answered</p>`}$('#content').innerHTML=x}function norm(s){return String(s||'').trim().toLowerCase().replace(/[.!?]+$/,'').trim()}function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}function chooseQuiz(i){if(quiz[qi]===undefined){quiz[qi]=i;render()}}function saveGaps(){document.querySelectorAll('.field').forEach((el,i)=>gaps[i]=el.value)}function updateExamProgress(){let n=Object.keys(exam).length;$('#examprogress').textContent=n+' / 10 answered';$('#submitExam').disabled=n<10}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));$('#toggle').onchange=e=>{if(tab==='gaps')saveGaps();showEu=e.target.checked;render()};render();</script></body></html>
